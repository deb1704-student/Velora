<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Brand Burgundy Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#722F37"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#D7A7B1" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- The ÉLAN Monogram Stem & Bars -->
  <!-- Vertical Spine -->
  <rect x="20" y="19" width="7" height="28" rx="1" fill="#F8F4E7"/>
  <!-- Top Horizontal Bar -->
  <rect x="20" y="19" width="22" height="6" rx="1" fill="#F8F4E7"/>
  <!-- Middle Horizontal Bar -->
  <rect x="20" y="30" width="18" height="6" rx="1" fill="#F8F4E7"/>
  <!-- Bottom Horizontal Bar -->
  <rect x="20" y="41" width="22" height="6" rx="1" fill="#F8F4E7"/>

  <!-- Architectural Acute Accent (´) in Soft Rose -->
  <polygon points="31,16 38,10 43,10 36,16" fill="#D7A7B1"/>

  <!-- Signature Rose Dot Accent -->
  <circle cx="46" cy="44" r="2.5" fill="#D7A7B1"/>
</svg>
